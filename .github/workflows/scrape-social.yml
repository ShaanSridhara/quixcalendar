name: Scrape social stats

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours, offset to avoid the top-of-hour rush
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: social-scraper/package-lock.json

      - name: Install dependencies
        working-directory: social-scraper
        run: npm ci

      - name: Install headless browser (for Instagram auto-discovery)
        working-directory: social-scraper
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: social-scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
        run: npm run scrape
